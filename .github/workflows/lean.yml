name: Steklov Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "40 */6 * * *"   # safety rebuild every 6 hours; pushes trigger a build immediately

concurrency:
  group: lean-verify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Commit steps below run `git pull --rebase`, which re-commits and needs an identity; without this the
      # status and map commits fail with "Committer identity unknown" whenever main moved during the build.
      - name: Configure git identity
        run: |
          git config user.name "lean-verify"
          git config user.email "lean-verify@users.noreply.github.com"

      # Installs the pinned Lean toolchain and downloads the prebuilt Mathlib cache.
      - uses: leanprover/lean-action@v1
        id: setup
        timeout-minutes: 12
        continue-on-error: true
        with:
          build: false
          use-mathlib-cache: true

      # The Mathlib cache download occasionally stalls near the end; retry it once.
      - name: Retry Mathlib cache download
        if: steps.setup.outcome != 'success'
        timeout-minutes: 15
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      # Build ourselves so the compiler output is saved for the status report.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Axiom audit (fails on build errors, sorry or non-standard axioms)
        if: always()
        run: python3 axiom_audit.py

      - name: Publish status to the run summary
        if: always()
        run: |
          if [ -f verification/STATUS.md ]; then cat verification/STATUS.md >> "$GITHUB_STEP_SUMMARY"; \
          else echo "# Lean verification status: FAIL (build did not finish)" >> "$GITHUB_STEP_SUMMARY"; fi

      # Commit the latest status file only when the result changed, so the history shows each change.
      - name: Commit status if changed
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -f verification/STATUS.json ] || exit 0
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("verification/STATUS.json"); d = json.loads(p.read_text()); d.pop("checked_at", None)
          pathlib.Path("verification/.status_key").write_text(json.dumps(d, sort_keys=True))
          PY
          git add verification/.status_key
          if git diff --cached --quiet; then echo "Status unchanged"; exit 0; fi
          git add verification/STATUS.md verification/STATUS.json
          git -c user.name="lean-verify" -c user.email="lean-verify@users.noreply.github.com" commit -m "Update Lean verification status"
          # main may have moved on during the build (e.g. a follow-up ROADMAP commit); rebase before pushing.
          # A status commit from another run conflicts only in the generated verification files; -X theirs keeps
          # this run's result (the replayed commit), so the rebase no longer aborts on those conflicts.
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push the status commit after 3 attempts"; exit 1

      # Regenerate the dependency map (docs/map/index.html) from the sources and STATUS.json.
      - name: Rebuild the dependency map
        if: always()
        continue-on-error: true
        run: python3 tools/build_map.py

      # Commit the map only when its content changed (.map_key leaves out the build time).
      - name: Commit dependency map if changed
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          [ -f docs/map/index.html ] || exit 0
          git add docs/map/.map_key
          if git diff --cached --quiet && git ls-files --error-unmatch docs/map/map.svg >/dev/null 2>&1; then echo "Map unchanged"; exit 0; fi
          git add docs/map/index.html docs/map/map.svg docs/map/README.md
          git -c user.name="lean-verify" -c user.email="lean-verify@users.noreply.github.com" commit -m "Update dependency map"
          # Same rebase strategy as the status step: generated map files take this run's version.
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push the map commit after 3 attempts"; exit 1
